<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World visuals preview</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f3e6d3; font: 12px/1.3 system-ui, sans-serif; color: #3a2a22; }
    canvas { display: block; }
    #panel { position: fixed; top: 8px; right: 8px; bottom: 8px; width: 250px; overflow-y: auto; background: rgba(255,250,242,.92); border: 2px solid #3a2a22; border-radius: 10px; padding: 6px 8px; }
    #panel.hide { display: none; }
    #panel h3 { margin: 6px 0 2px; font-size: 12px; }
    .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    .row span { flex: 0 0 112px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row input[type=range] { flex: 1; min-width: 0; }
    .row b { flex: 0 0 26px; text-align: right; font-weight: 600; }
    select, button { font: 600 12px system-ui; color: #3a2a22; background: #fffaf2; border: 2px solid #3a2a22; border-radius: 7px; padding: 2px 6px; }
    #hud { position: fixed; top: 8px; left: 8px; font: 700 13px system-ui; background: rgba(255,250,242,.9); padding: 3px 9px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="hud">loading…</div>
  <div id="panel"></div>
  <script type="module" src="./visuals.ts"></script>
</body>
</html>
