<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FX preview</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f3e6d3; font: 13px/1.3 system-ui, sans-serif; }
    canvas { display: block; }
    #ui { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    button, select, label { background: #fffaf2; border: 2px solid #3a2a22; border-radius: 8px; padding: 3px 8px; font: 600 12px system-ui; color: #3a2a22; cursor: pointer; }
    button:hover { background: #ffe3a8; }
    .lbl { position: fixed; transform: translate(-50%, 0); font: 700 12px system-ui; color: #3a2a22; background: rgba(255,250,242,.85); padding: 1px 6px; border-radius: 6px; pointer-events: none; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="ui"></div>
  <script type="module" src="./fx.ts"></script>
</body>
</html>
